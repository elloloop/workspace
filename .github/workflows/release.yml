name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.26.6'
  GOVULNCHECK_VERSION: 'v1.1.4'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # A release publishes only a commit main's CI already passed: every gate
  # ci.yml runs (lint, race + coverage, integration, e2e, fuzz, docker) ran on this exact commit in the merge queue and on main. Re-running
  # them here doubled the release time and could not catch anything new;
  # only the vulnerability scan, whose database moves daily, runs again.
  # ---------------------------------------------------------------------------
  verified:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - name: The tag is on main and main's CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          status="$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)"
          if [[ "$status" != identical && "$status" != behind ]]; then
            echo "::error::$SHA is not on main (compare status: $status); tag a commit from main"
            exit 1
          fi
          # main's CI may still be running when a tag follows a merge closely.
          for _ in $(seq 1 90); do
            conclusions="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=CI&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions") | .conclusion // "pending"] | join(" ")')"
            if [[ " $conclusions " == *" success "* ]]; then
              echo "CI passed on $SHA"
              exit 0
            fi
            if [[ -n "$conclusions" && " $conclusions " != *" pending "* ]]; then
              echo "::error::CI did not pass on $SHA (conclusions: $conclusions)"
              exit 1
            fi
            sleep 10
          done
          echo "::error::no passing CI on $SHA after 15 minutes"
          exit 1

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: govulncheck
        run: govulncheck ./...






  # ---------------------------------------------------------------------------
  # Build, push, sign, and scan the published image.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [verified, vuln]
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless OIDC
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - name: Inject version from git tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "$VER" > VERSION

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          target: server
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A tag's Actions cache is visible to that tag alone, so a release
          # writing one only evicted main's caches. It reads main's layers.
          cache-from: type=gha,scope=ci-docker
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign published image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign each tag's specific digest. cosign records the signature in the same registry.
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  # ---------------------------------------------------------------------------
  # Post-publish vulnerability scan. Tag is already published; this fails the
  # release run if HIGH/CRITICAL CVEs are found in the image, so the operator
  # is alerted before users pull it.
  # ---------------------------------------------------------------------------
  scan-image:
    name: Scan published image (Trivy)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Pick first tag for scanning
        id: tag
        env:
          TAGS: ${{ needs.build-and-push.outputs.tags }}
        run: |
          # All tags point to the same digest; pick the first.
          first_tag="$(echo "$TAGS" | head -n1)"
          echo "image=${first_tag}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        # v0.36.0 (2026-04-22), pinned by commit SHA. Tags 0.0.1–0.34.2
        # are flagged as compromised by the Trivy March 2026 advisory.
        # SHA pin defends against future tag retargeting.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  # ---------------------------------------------------------------------------
  # Publish the proto sources as versioned archives on the GitHub Release,
  # alongside a reference to the just-published container image. Consumers
  # who want to codegen against a specific workspaces version can download
  # `workspaces-protos-<version>.tar.gz` instead of vendoring a git ref.
  # ---------------------------------------------------------------------------
  release-protos:
    name: Publish proto bundle to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build proto archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          mkdir -p dist
          tar -czf "dist/workspaces-protos-${VER}.tar.gz" proto buf.yaml buf.gen.yaml
          (cd "$GITHUB_WORKSPACE" && zip -r "dist/workspaces-protos-${VER}.zip" proto buf.yaml buf.gen.yaml)
          (cd dist && sha256sum \
            "workspaces-protos-${VER}.tar.gz" \
            "workspaces-protos-${VER}.zip" \
            > "workspaces-protos-${VER}.sha256")
          ls -la dist/

      - name: Create GitHub Release with proto bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          notes_file="$(mktemp)"
          {
            echo "## Container image"
            echo
            echo "\`${IMAGE}:${VER}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Signed via cosign keyless OIDC and scanned with Trivy (HIGH/CRITICAL gate)."
            echo
            echo "## Proto bundle"
            echo
            echo "The \`workspaces-protos-${VER}.{tar.gz,zip}\` archives contain the \`proto/\` tree, \`buf.yaml\`, and \`buf.gen.yaml\` from this tag. Consumers can vendor or codegen against this exact version without depending on a git ref."
            echo
            echo "Verify integrity using the accompanying \`workspaces-protos-${VER}.sha256\` file."
          } > "$notes_file"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$notes_file" \
            "dist/workspaces-protos-${VER}.tar.gz" \
            "dist/workspaces-protos-${VER}.zip" \
            "dist/workspaces-protos-${VER}.sha256"
